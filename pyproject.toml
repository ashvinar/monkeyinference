[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeyinference"
version = "0.1.0"
description = "Standalone Metal/MLX inference engine for Prism ternary Bonsai 2 27B on Apple silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashvin Arora" }]
dependencies = [
  "mlx>=0.32.0",
  "mlx-lm>=0.31.3",
  "numpy>=2.0",
  "tokenizers>=0.21",
  "transformers>=4.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
monkeyinference = "monkeyinference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
